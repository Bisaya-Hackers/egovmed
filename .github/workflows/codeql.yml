name: CodeQL

# Runs GitHub's semantic code analysis for common JS/TS security antipatterns —
# SQL/NoSQL injection, XSS sinks, path traversal, unsafe deserialization, prototype
# pollution, etc. Findings appear under Security > Code scanning alerts on the repo.
#
# Free for public repos. Rules are managed by GitHub, no config needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly baseline scan so a new CVE-worthy pattern in the ruleset applies to code
    # that hasn't been touched in a while. Sunday 12:34 UTC (odd time avoids the top-of-hour
    # queue rush on shared runners).
    - cron: '34 12 * * 0'

jobs:
  analyze:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL requires GitHub Advanced Security, which is FREE on public repos and PAID
    # on private repos. This guard makes the workflow inert on private repos (it won't
    # even start jobs), so no red-X noise on every push. Flip the repo to public and
    # CodeQL kicks in automatically. Alternative if you want CodeQL on a private repo:
    # enable GitHub Advanced Security in repo Settings > Code security (paid).
    if: github.event.repository.private == false || github.repository_visibility == 'public'
    permissions:
      # Required so CodeQL can upload SARIF results to the Security tab.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes the security-extended pack plus code-quality rules.
          # security-extended alone is fine if you want less noise; upgrade later if useful.
          queries: security-extended
          # Suppresses js/missing-rate-limiting (custom middleware not detectable by the rule).
          # Every other rule in security-extended still runs.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
