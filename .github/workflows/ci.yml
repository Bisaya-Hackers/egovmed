name: CI

on:
  push: {}
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch so a fast follow-up push doesn't queue behind
# a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so trufflehog scans every commit on this ref, not just the tip.
          # Catches secrets that were committed and then removed in a later commit.
          fetch-depth: 0

      # Blocks PRs that introduce any hardcoded API key, private key, JWT, cloud credential,
      # or high-entropy string. Uses trufflehog's built-in ruleset — no config needed.
      # `--only-verified` cuts false positives to near zero (each finding is actively
      # validated against the issuing provider), but SLOWER on private repos. If the run
      # gets too slow, drop --only-verified and accept some noise. We use trufflehog rather
      # than gitleaks-action because gitleaks-action@v2 requires a paid license for orgs.
      - name: Detect committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unknown

  backend:
    name: Backend (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` is stricter than `npm install` — fails hard if package-lock.json is out of
      # sync with package.json, catching a common source of "works on my machine" bugs.
      - name: Install dependencies
        run: npm ci

      # Fails on any high-or-critical vulnerability in a production dep. Moderate/low are
      # noted in the log but don't block — Dependabot picks those up asynchronously.
      # Runtime deps only (--omit=dev) so a dev-only vuln in ethers-testkit or similar
      # doesn't block a PR that never ships that code.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # 16 regression tests (11 baseline + 5 added for /integrations/status, credential-leak
      # sentinels, benefits reflection, cross-tenant payment attribution, rate limit).
      # This is the merge gate — the mock-to-live rollout depends on these staying green.
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Frontend has no runtime backend, so dev deps ARE the shipped surface (vite bundles
      # them into dist). Scan everything, high-and-above blocks. This is what would have
      # caught the vite 5→6 CVEs earlier.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Full production build — catches Vite/React errors, missing imports, and unresolved
      # module references before they reach a Vercel preview deploy.
      - name: Build
        run: npm run build
